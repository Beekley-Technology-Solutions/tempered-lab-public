# Build once, then publish. Every commit on main becomes one release, vMAJOR.MINOR.<run number>: each
# service image (both architectures, one index, signed, with SBOM and provenance), and one zip holding the
# CDK assembly, the chart, and release.json naming the digests. CodePipeline promotes that zip unchanged;
# nothing deploys from here.
# Then the commit and its tag go to the public mirror, after a full-history scan (ADR 0003).
name: Release
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false # releases land in order, so the mirror only ever fast-forwards

jobs:
  version:
    name: "Release: version"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      services: ${{ steps.version.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # MAJOR.MINOR is hand-set in package.json; PATCH is this workflow's run number (a re-run keeps it).
      - id: version
        run: |
          VERSION=v$(jq -r '.version | split(".")[0:2] | join(".")' package.json).$GITHUB_RUN_NUMBER
          [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "services=$(for d in services/*/Dockerfile; do basename "$(dirname "$d")"; done | jq -Rsc 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  # Each service, each architecture, on a native runner: the gate's own build script, then an immutable
  # <sha>-<arch> tag. Graviton nodes are a config change, not a rebuild.
  build:
    name: "Release: build ${{ matrix.service }} (${{ matrix.arch }})"
    needs: version
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    environment: build
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service: ${{ fromJSON(needs.version.outputs.services) }}
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.BUILD_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - env:
          REGISTRY: ${{ vars.TL_TOOLS_ACCOUNT }}.dkr.ecr.us-east-1.amazonaws.com
          SERVICE: ${{ matrix.service }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.version }}
        run: .github/scripts/release-images.sh push "$SERVICE" "$ARCH" "$GITHUB_SHA" "$VERSION"

  # One multi-arch index per service, tagged <sha> and <version>, then signed with the KMS key and given
  # SBOM and SLSA provenance attestations, each verified with the public key admission uses (ADR 0009).
  sign:
    name: "Release: index and sign"
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.BUILD_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - env:
          REGISTRY: ${{ vars.TL_TOOLS_ACCOUNT }}.dkr.ecr.us-east-1.amazonaws.com
          VERSION: ${{ needs.version.outputs.version }}
          SERVICES: ${{ needs.version.outputs.services }}
        run: |
          for service in $(jq -r '.[]' <<<"$SERVICES"); do
            .github/scripts/release-images.sh index "$service" "$GITHUB_SHA" "$VERSION"
          done
          .github/scripts/release-images.sh sign "$GITHUB_SHA" "$VERSION" images.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images
          path: images.json

  release:
    name: "Release: assembly"
    needs: [version, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only environment the build role trusts; limited to main in the repo settings.
    environment: build
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ needs.version.outputs.version }}
    env:
      # Environment variables on `build`, never code (ADR 0004).
      TL_TOOLS_ACCOUNT: ${{ vars.TL_TOOLS_ACCOUNT }}
      TL_WORKLOAD_ACCOUNT: ${{ vars.TL_WORKLOAD_ACCOUNT }}
      TL_ALERT_EMAIL: ${{ vars.TL_ALERT_EMAIL }}
      TL_REPO_SUBJECT: ${{ vars.TL_REPO_SUBJECT }}
      TL_ANOMALY_MONITOR_ARN: ${{ vars.TL_ANOMALY_MONITOR_ARN }}
      TL_ADMIN_CIDR: ${{ vars.TL_ADMIN_CIDR }}
      TL_ADMIN_ROLE_ARN: ${{ vars.TL_ADMIN_ROLE_ARN }}
      RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
      REGISTRY: ${{ vars.TL_TOOLS_ACCOUNT }}.dkr.ecr.us-east-1.amazonaws.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      # Real identifiers this time, still no AWS credentials needed to synth.
      - run: cd infra && pnpm cdk synth --quiet
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.BUILD_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      # Digest proof: every digest the release names is ECR's index for this commit and carries our signature.
      - run: .github/scripts/release-images.sh prove images.json "$GITHUB_SHA"
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # One zip, promoted unchanged: the assembly at the root, the chart and deploy scripts under deploy/.
          # No registry or account in release.json or the tag: both are published.
          jq -n --arg version "$VERSION" --arg sha "$GITHUB_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --slurpfile images images.json \
            '{version: $version, sha: $sha, run: $run, images: $images[0]}' > infra/cdk.out/release.json
          cp -r deploy infra/cdk.out/deploy
          cd infra/cdk.out
          zip -qr ../../tempered-lab.zip .
          aws s3 cp ../../tempered-lab.zip "s3://$RELEASE_BUCKET/releases/tempered-lab.zip" --no-progress \
            --metadata "version=$VERSION,sha=$GITHUB_SHA"
          echo "::notice::released $VERSION ($GITHUB_SHA): $(jq -c .images release.json)"

  # The only job that writes to this repo. It runs no repo or third-party code: no checkout, no install.
  tag:
    name: "Release: git tag"
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Tags are never moved: a re-run only checks the existing one names this commit.
          if TAGGED=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERSION" -q .sha 2>/dev/null); then
            [ "$TAGGED" = "$GITHUB_SHA" ] || { echo "::error::$VERSION already tags $TAGGED, not $GITHUB_SHA"; exit 1; }
            exit 0
          fi
          MESSAGE=$(printf 'Tempered Lab %s\n\nrun: %s/%s/actions/runs/%s\n' "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$VERSION" -f object="$GITHUB_SHA" -f type=commit -f message="$MESSAGE" -q .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$TAG" >/dev/null

  # Full history, every tag: Gitleaks plus the deny list of real identifiers. No token that can write anywhere.
  scan:
    name: "Publish: scan history"
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks && rm gitleaks.tgz
      - env:
          PUBLISH_DENYLIST: ${{ secrets.PUBLISH_DENYLIST }}
        run: .github/scripts/scan-history.sh

  # Holds the publisher app's token and runs no repo code: checkout only fetches objects.
  mirror:
    name: "Publish: push to mirror"
    needs: [release, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
          owner: ${{ vars.MIRROR_OWNER }}
          repositories: ${{ vars.MIRROR_REPO }}
          permission-contents: write
          permission-workflows: write # the mirror carries .github/workflows (Actions are off there)
      - env:
          TOKEN: ${{ steps.app.outputs.token }}
          MIRROR: ${{ vars.MIRROR_OWNER }}/${{ vars.MIRROR_REPO }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git push "https://x-access-token:${TOKEN}@github.com/${MIRROR}.git" \
            "${GITHUB_SHA}:refs/heads/main" "refs/tags/${VERSION}:refs/tags/${VERSION}"
          echo "::notice::published $VERSION ($GITHUB_SHA) to $MIRROR"

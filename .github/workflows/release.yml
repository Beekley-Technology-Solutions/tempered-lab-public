# Build once, then publish. Every commit on main becomes one release, vMAJOR.MINOR.<run number>.
# Phase 0: the assembly and release.json, zipped to the release bucket. Phase 1 adds the images
# (built, pushed by digest, signed) and the CodePipeline that promotes the zip. Nothing deploys from here.
# Then the commit and its tag go to the public mirror, after a full-history scan (ADR 0003).
name: Release
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false # releases land in order, so the mirror only ever fast-forwards

jobs:
  release:
    name: "Release: assembly"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only environment the build role trusts; limited to main in the repo settings.
    environment: build
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # Environment variables on `build`, never code (ADR 0004).
      TL_TOOLS_ACCOUNT: ${{ vars.TL_TOOLS_ACCOUNT }}
      TL_WORKLOAD_ACCOUNT: ${{ vars.TL_WORKLOAD_ACCOUNT }}
      TL_ALERT_EMAIL: ${{ vars.TL_ALERT_EMAIL }}
      TL_REPO_SUBJECT: ${{ vars.TL_REPO_SUBJECT }}
      TL_ANOMALY_MONITOR_ARN: ${{ vars.TL_ANOMALY_MONITOR_ARN }}
      TL_ADMIN_CIDR: ${{ vars.TL_ADMIN_CIDR }}
      TL_ADMIN_ROLE_ARN: ${{ vars.TL_ADMIN_ROLE_ARN }}
      RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      # MAJOR.MINOR is hand-set in package.json; PATCH is this workflow's run number (a re-run keeps it).
      - id: version
        run: |
          VERSION=v$(node -p 'require("./package.json").version.split(".").slice(0, 2).join(".")').$GITHUB_RUN_NUMBER
          [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # Real identifiers this time, still no AWS credentials needed to synth.
      - run: cd infra && pnpm cdk synth --quiet
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.BUILD_ROLE_ARN }}
          aws-region: us-east-1
      - env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd infra/cdk.out
          # No registry or account in release.json or the tag: both are published.
          jq -n --arg version "$VERSION" --arg sha "$GITHUB_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{version: $version, sha: $sha, run: $run}' > release.json
          zip -qr ../../tempered-lab.zip .
          aws s3 cp ../../tempered-lab.zip "s3://$RELEASE_BUCKET/releases/tempered-lab.zip" --no-progress \
            --metadata "version=$VERSION,sha=$GITHUB_SHA"
          echo "::notice::released $VERSION ($GITHUB_SHA)"

  # The only job that writes to this repo. It runs no repo or third-party code: no checkout, no install.
  tag:
    name: "Release: git tag"
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Tags are never moved: a re-run only checks the existing one names this commit.
          if TAGGED=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERSION" -q .sha 2>/dev/null); then
            [ "$TAGGED" = "$GITHUB_SHA" ] || { echo "::error::$VERSION already tags $TAGGED, not $GITHUB_SHA"; exit 1; }
            exit 0
          fi
          MESSAGE=$(printf 'Tempered Lab %s\n\nrun: %s/%s/actions/runs/%s\n' "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$VERSION" -f object="$GITHUB_SHA" -f type=commit -f message="$MESSAGE" -q .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$TAG" >/dev/null

  # Full history, every tag: Gitleaks plus the deny list of real identifiers. No token that can write anywhere.
  scan:
    name: "Publish: scan history"
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks && rm gitleaks.tgz
      - env:
          PUBLISH_DENYLIST: ${{ secrets.PUBLISH_DENYLIST }}
        run: .github/scripts/scan-history.sh

  # Holds the publisher app's token and runs no repo code: checkout only fetches objects.
  mirror:
    name: "Publish: push to mirror"
    needs: [release, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
          owner: ${{ vars.MIRROR_OWNER }}
          repositories: ${{ vars.MIRROR_REPO }}
          permission-contents: write
          permission-workflows: write # the mirror carries .github/workflows (Actions are off there)
      - env:
          TOKEN: ${{ steps.app.outputs.token }}
          MIRROR: ${{ vars.MIRROR_OWNER }}/${{ vars.MIRROR_REPO }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git push "https://x-access-token:${TOKEN}@github.com/${MIRROR}.git" \
            "${GITHUB_SHA}:refs/heads/main" "refs/tags/${VERSION}:refs/tags/${VERSION}"
          echo "::notice::published $VERSION ($GITHUB_SHA) to $MIRROR"

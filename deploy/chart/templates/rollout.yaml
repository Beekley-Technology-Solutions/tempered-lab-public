apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels: {{- include "service.selector" . | nindent 6 }}
  strategy:
    canary:
      stableService: {{ .Values.name }}-stable
      canaryService: {{ .Values.name }}-canary
      {{- if .Values.ingress.enabled }}
      trafficRouting:
        alb:
          ingress: {{ .Values.name }}
          servicePort: 80
      {{- end }}
      steps: {{- toYaml .Values.canarySteps | nindent 8 }}
  template:
    metadata:
      labels: {{- include "service.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ .Values.name }}
          # By digest only: admission refuses tags (ADR 0009).
          image: "{{ required "image.repository is required" .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          ports:
            - { name: http, containerPort: {{ .Values.port }} }
          env:
            - { name: TL_STAGE, value: {{ .Values.stage | quote }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
